name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('pom.xml') }}

      - name: Build
        run: mvn -B -ntp package

      - name: Verify jar layout
        run: |
          jar tf target/PwLog.jar | grep -qx 'plugin.yml'
          jar tf target/PwLog.jar | grep -qx 'com/example/pwlogger/PwLog.class'

      - uses: actions/upload-artifact@v4
        with:
          name: PwLog
          path: target/PwLog.jar
          if-no-files-found: error
